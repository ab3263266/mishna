<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משנה יומית</title>
<style>
  :root{
    --bg:#f7f4ec; --card:#fffdf7; --ink:#1f1a12; --muted:#7d7264;
    --line:#e6ddc9; --accent:#8b5e34; --accent-ink:#fff; --rule:#d9cdb4;
    --good:#2e7d52; --bad:#c0392b; --freeze:#2b7bb9; --shabbat:#7a52a8;
    --shadow:0 1px 2px rgba(60,40,10,.05),0 10px 30px rgba(60,40,10,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14120e; --card:#1d1a15; --ink:#efe7d8; --muted:#a2988a;
           --line:#332d24; --accent:#c99b6a; --accent-ink:#1a1509; --rule:#3d362b;
           --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Segoe UI","Assistant",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 130px}
  .hidden{display:none!important}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
         background:var(--card);color:var(--ink);padding:10px 16px;font-weight:600}
  button:hover{filter:brightness(.97)} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  button.wide{width:100%}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  select,input{width:100%;padding:11px 13px;border-radius:10px;
               border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}

  /* ---- slim status strip: the gamification, deliberately small ---- */
  .strip{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
         margin:0 -16px 20px;padding:9px 16px;display:flex;align-items:center;
         gap:14px;font-size:13px;color:var(--muted)}
  .strip .where{flex:1;font-weight:700;color:var(--ink);font-size:14px}
  .strip b{color:var(--ink)}

  /* ---- the mishnah itself: the hero ---- */
  .mishnah{background:var(--card);border:1px solid var(--line);border-radius:14px;
           padding:26px 26px 20px;margin-bottom:16px;box-shadow:var(--shadow);position:relative}
  .mishnah.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
  .mishnah-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;
                padding-bottom:12px;border-bottom:2px solid var(--rule)}
  .mishnah-head h2{margin:0;font-size:17px;letter-spacing:-.2px}
  .mishnah-head .tick{margin-inline-start:auto;font-size:13px;color:var(--good);font-weight:700}

  .text{font-family:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
        font-size:23px;line-height:2.05;text-align:justify;
        -webkit-font-feature-settings:"kern";font-kerning:normal}
  .text b{font-weight:700}
  body.no-nikud .text{font-family:"Frank Ruhl Libre","David Libre",serif}

  .srcline{margin-top:14px;font-size:11.5px;color:var(--muted);
           display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .srcline a{color:var(--muted)}

  /* ---- commentaries ---- */
  .comm{margin-top:18px;border-top:1px solid var(--line);padding-top:4px}
  details{border-bottom:1px solid var(--line)}
  details:last-child{border-bottom:0}
  summary{cursor:pointer;padding:12px 2px;font-weight:700;font-size:15px;
          list-style:none;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"›";display:inline-block;transition:transform .18s;
                  color:var(--accent);font-size:19px;font-weight:700}
  details[open] summary::before{transform:rotate(90deg)}
  summary .lic{margin-inline-start:auto;font-size:10.5px;font-weight:500;color:var(--muted)}
  .comm-body{padding:2px 2px 16px;font-family:"Frank Ruhl Libre","David Libre",serif;
             font-size:18px;line-height:1.95;text-align:justify;color:var(--ink)}
  .comm-body[lang=en]{font-family:Georgia,serif;font-size:16px;direction:ltr;text-align:left}
  .comm-body b{color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:17px}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  .kv{display:flex;justify-content:space-between;padding:8px 0;
      border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border:0} .kv span:last-child{font-weight:700}

  .actions{position:fixed;inset-inline:0;bottom:44px;z-index:35;padding:0 16px;
           pointer-events:none}
  .actions .inner{max-width:720px;margin:0 auto;pointer-events:auto}
  .actions button{box-shadow:0 6px 20px rgba(0,0,0,.16)}

  .banner{border-radius:11px;padding:13px 15px;margin-bottom:14px;font-size:14px;
          border:1px solid transparent}
  .banner.shabbat{background:color-mix(in srgb,var(--shabbat) 12%,transparent);
                  border-color:color-mix(in srgb,var(--shabbat) 35%,transparent)}
  .banner.freeze{background:color-mix(in srgb,var(--freeze) 12%,transparent);
                 border-color:color-mix(in srgb,var(--freeze) 35%,transparent)}
  .banner b{display:block;margin-bottom:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:4px;margin-top:10px}
  .day{aspect-ratio:1;border-radius:6px;background:var(--line);display:grid;
       place-items:center;font-size:10px;color:var(--muted)}
  .day.completed{background:var(--good);color:#fff}
  .day.missed{background:var(--bad);color:#fff}
  .day.frozen_item{background:var(--freeze);color:#fff}
  .day.shabbat_unreported,.day.shabbat_pending{background:var(--shabbat);color:#fff;opacity:.75}

  .toast{position:fixed;inset-inline:0;bottom:100px;margin:0 auto;width:max-content;
         max-width:88%;background:var(--ink);color:var(--bg);padding:11px 20px;
         border-radius:999px;font-weight:600;font-size:14px;opacity:0;
         pointer-events:none;transition:opacity .25s;z-index:60}
  .toast.show{opacity:1}

  .devbar{position:fixed;inset-inline:0;bottom:0;background:var(--card);
          border-top:1px solid var(--line);padding:6px 12px;z-index:40}
  .devbar .inner{max-width:720px;margin:0 auto;display:flex;gap:6px;
                 align-items:center;flex-wrap:wrap;font-size:12px}
  .devbar button{padding:5px 9px;font-size:12px;border-radius:8px}
  .devbar .clock{color:var(--muted);margin-inline-end:auto}
  .tag{font-size:10px;background:var(--accent);color:var(--accent-ink);
       padding:2px 6px;border-radius:4px;font-weight:700}
  .spinner{text-align:center;padding:50px 0;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <section id="screen-login">
    <div class="card" style="margin-top:60px">
      <h2>משנה יומית</h2>
      <p class="sub">לימוד משנה יומי — הטקסט, הפירושים, ומעקב.</p>
      <label for="email">אימייל</label>
      <input id="email" value="demo@example.com" autocomplete="off">
      <label for="shabbat-mode">שמירת שבת</label>
      <select id="shabbat-mode">
        <option value="1">כן — הפעל מצב שבת</option>
        <option value="0">לא</option>
      </select>
      <div class="row" style="margin-top:18px">
        <button class="primary wide" onclick="devLogin()">כניסה</button>
      </div>
    </div>
  </section>

  <section id="screen-onboarding" class="hidden">
    <div class="card" style="margin-top:40px">
      <h2>מה לומדים?</h2>
      <p class="sub">63 מסכתות, 4,192 משניות.</p>
      <label for="tractate">מסכת</label>
      <select id="tractate"></select>
      <label for="goal">כמה משניות ביום</label>
      <select id="goal">
        <option>1</option><option selected>2</option><option>3</option>
        <option>4</option><option>5</option><option>10</option>
      </select>
      <div class="row" style="margin-top:18px">
        <button class="primary wide" onclick="createPlan()">התחל</button>
      </div>
    </div>
  </section>

  <section id="screen-app" class="hidden">
    <div class="strip">
      <span class="where" id="where">—</span>
      <span title="רצף">🔥 <b id="streak">0</b></span>
      <span title="נקודות">✦ <b id="points">0</b></span>
      <button onclick="toggleNikud()" style="padding:4px 9px;font-size:11.5px"
              id="nikud-btn" title="ניקוד">אָ</button>
    </div>

    <div id="banners"></div>
    <div id="portion"><div class="spinner">טוען…</div></div>

    <div id="shabbat-report" class="hidden">
      <button class="primary wide" onclick="reportShabbat()">
        ✓ למדתי את המנה הכפולה בשבת
      </button>
    </div>

    <details class="card" style="margin-top:20px">
      <summary style="font-size:16px">התקדמות ורצף</summary>
      <div style="padding-top:10px">
        <div class="kv"><span>הושלמו</span><span id="p-done">—</span></div>
        <div class="kv"><span>סיום משוער</span><span id="p-eta">—</span></div>
        <div class="kv"><span>הרצף הארוך ביותר</span><span id="p-longest">—</span></div>
        <div class="kv"><span>נקודות</span><span id="p-points">—</span></div>
        <div class="grid" id="history"></div>
        <div id="shop" style="margin-top:14px"></div>
      </div>
    </details>
  </section>
</div>

<div class="actions hidden" id="actions"><div class="inner">
  <button class="primary wide" id="btn-done" onclick="markDone()">סיימתי ללמוד</button>
</div></div>

<div class="toast" id="toast"></div>

<div class="devbar">
  <div class="inner">
    <span class="tag">DEV</span>
    <span class="clock" id="clock">—</span>
    <button onclick="shift({hours:6})">+6ש׳</button>
    <button onclick="shift({days:1})">+יום</button>
    <button onclick="grant()">+200</button>
    <button onclick="resetAll()">איפוס</button>
  </div>
</div>

<script>
const API = "/api/v1";
let token = localStorage.getItem("token") || "";
let state = null, portion = null;

async function api(path, {method="GET", body=null} = {}) {
  const res = await fetch(API + path, {
    method,
    headers: {"Content-Type":"application/json", ...(token?{"Authorization":"Bearer "+token}:{})},
    body: body ? JSON.stringify(body) : null
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const d = data?.detail;
    const err = new Error(d?.message || d?.code || res.statusText);
    err.code = d?.code; err.status = res.status;
    throw err;
  }
  return data;
}

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2800);
}
function show(screen){
  for (const id of ["login","onboarding","app"])
    document.getElementById("screen-"+id).classList.toggle("hidden", id!==screen);
  document.getElementById("actions").classList.toggle("hidden", screen!=="app");
}

// Sefaria ships light inline markup that carries meaning (the bold dibur
// hamatchil). The server already stripped everything else, so this builds
// the node tree by hand rather than trusting innerHTML with remote content.
const INLINE_OK = new Set(["B","I","EM","STRONG","BR","SPAN","BIG","SMALL"]);
function renderMarkup(target, html){
  target.textContent = "";
  const parsed = new DOMParser().parseFromString("<div>"+html+"</div>", "text/html");
  (function walk(src, dst){
    for (const node of src.childNodes){
      if (node.nodeType === Node.TEXT_NODE){ dst.appendChild(document.createTextNode(node.data)); }
      else if (node.nodeType === Node.ELEMENT_NODE && INLINE_OK.has(node.tagName)){
        const el = document.createElement(node.tagName.toLowerCase());
        walk(node, el); dst.appendChild(el);
      } else if (node.nodeType === Node.ELEMENT_NODE){ walk(node, dst); }
    }
  })(parsed.body.firstChild, target);
}

// Mishnah references are cited in Hebrew numerals, never digits. "פרק א,
// משנה ב" is how a learner reads it; "פרק 1, משנה 2" looks like a spreadsheet.
const GERESH = "׳", GERSHAYIM = "״";
const ONES = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
const TENS = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
const HUNDREDS = ["","ק","ר","ש","ת"];
function gematria(n){
  if (n <= 0) return String(n);
  let out = "";
  out += HUNDREDS[Math.floor(n / 100)] || "";
  n %= 100;
  if (n === 15) out += "טו";                 // not יה - that spells the Name
  else if (n === 16) out += "טז";            // likewise for יו
  else { out += TENS[Math.floor(n / 10)]; out += ONES[n % 10]; }
  if (out.length === 1) return out + GERESH;
  return out.slice(0, -1) + GERSHAYIM + out.slice(-1);
}

const NIKUD = /[֑-ׇ]/g;
let nikudOn = localStorage.getItem("nikud") !== "0";
function toggleNikud(){
  nikudOn = !nikudOn;
  localStorage.setItem("nikud", nikudOn ? "1" : "0");
  renderPortion();
}

function passageHTML(p){
  const el = document.createElement("div");
  el.className = "comm-body";
  if (p.language === "en") el.lang = "en";
  renderMarkup(el, p.body);
  if (!nikudOn && p.language !== "en") el.textContent = el.textContent.replace(NIKUD, "");
  return el;
}

function renderPortion(){
  const host = document.getElementById("portion");
  host.textContent = "";
  if (!portion) return;

  for (const m of portion.mishnayot){
    const card = document.createElement("article");
    card.className = "mishnah" + (m.done ? " done" : "");

    const head = document.createElement("div");
    head.className = "mishnah-head";
    const h = document.createElement("h2");
    h.textContent = `${portion.tractate} · פרק ${gematria(m.chapter)}, משנה ${gematria(m.number)}`;
    head.appendChild(h);
    if (m.done){
      const tick = document.createElement("span");
      tick.className = "tick"; tick.textContent = "✓ נלמדה";
      head.appendChild(tick);
    }
    card.appendChild(head);

    if (m.text){
      const body = document.createElement("div");
      body.className = "text";
      renderMarkup(body, m.text.body);
      if (!nikudOn) body.textContent = body.textContent.replace(NIKUD, "");
      card.appendChild(body);

      const src = document.createElement("div");
      src.className = "srcline";
      const a = document.createElement("a");
      a.href = m.text.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Sefaria";
      src.append(document.createTextNode(`${m.text.version || ""} · ${m.text.license || ""} · `), a);
      card.appendChild(src);
    } else {
      const warn = document.createElement("p");
      warn.className = "sub";
      warn.textContent = "הטקסט אינו זמין כרגע — נסה שוב מאוחר יותר.";
      card.appendChild(warn);
    }

    if (m.commentaries.length){
      const comm = document.createElement("div");
      comm.className = "comm";
      m.commentaries.forEach((c, i) => {
        const d = document.createElement("details");
        if (i === 0) d.open = true;              // Bartenura open by default
        const s = document.createElement("summary");
        s.appendChild(document.createTextNode(c.title));
        const lic = document.createElement("span");
        lic.className = "lic";
        lic.textContent = [c.note, c.license].filter(Boolean).join(" · ");
        s.appendChild(lic);
        d.appendChild(s);
        d.appendChild(passageHTML(c));
        comm.appendChild(d);
      });
      card.appendChild(comm);
    }
    host.appendChild(card);
  }
}

async function boot(){
  await tick();
  try { state = await api("/study/today"); }
  catch (err){
    if (err.code === "no_active_plan"){ await loadTractates(); show("onboarding"); return; }
    if (err.status === 401){ localStorage.removeItem("token"); token=""; show("login"); return; }
    toast("שגיאה: " + err.message); throw err;
  }
  show("app");
  renderStrip();
  portion = await api("/study/portion");
  renderPortion();
  await Promise.all([loadHistory(), loadShop()]);
}

const DAY_NAMES = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];

function renderStrip(){
  const s = state;
  document.getElementById("streak").textContent = s.current_streak;
  document.getElementById("points").textContent = s.total_points;
  const d = new Date(s.local_date + "T00:00:00");
  document.getElementById("where").textContent =
    `יום ${DAY_NAMES[d.getDay()]} · ${s.completed_units}/${s.required_units}` +
    (s.is_double_portion ? " · מנה כפולה" : "");

  const b = [];
  if (s.penalties_frozen)
    b.push(`<div class="banner shabbat"><b>🕯️ מצב שבת</b>העונשים מוקפאים — לא תאבד רצף ולא נקודות.</div>`);
  else if (s.is_double_portion)
    b.push(`<div class="banner freeze"><b>📖 מנה כפולה</b>${s.required_units} משניות — של שישי ושל שבת.</div>`);
  if (s.can_report_shabbat)
    b.push(`<div class="banner shabbat"><b>🌙 מוצאי שבת</b>דווח על הלימוד כדי לקבל את הנקודות.</div>`);
  document.getElementById("banners").innerHTML = b.join("");

  document.getElementById("shabbat-report").classList.toggle("hidden", !s.can_report_shabbat);
  const done = s.required_units > 0 && s.completed_units >= s.required_units;
  const btn = document.getElementById("btn-done");
  btn.disabled = done || s.required_units === 0;
  btn.textContent = done ? "✓ סיימת להיום" :
    s.required_units === 0 ? "אין מכסה היום" :
    `סיימתי ללמוד (${s.points_if_completed} נק׳)`;

  document.getElementById("p-done").textContent = `${s.progress.completed} / ${s.progress.total}`;
  document.getElementById("p-eta").textContent = s.progress.estimated_end_date || "—";
  document.getElementById("p-longest").textContent = s.longest_streak;
  document.getElementById("p-points").textContent = s.total_points;
}

async function markDone(){
  const remaining = state.required_units - state.completed_units;
  if (remaining <= 0) return;
  const r = await api("/study/log", {method:"POST", body:{units:remaining}});
  toast(r.day_completed ? `יישר כוח! +${r.points_awarded} נק׳` : "נרשם");
  await boot();
}

async function reportShabbat(){
  const r = await api("/study/shabbat-report", {method:"POST", body:{completed:true}});
  toast(`+${r.friday_points + r.shabbat_points + r.motash_bonus} נק׳`);
  await boot();
}

async function loadHistory(){
  const since = new Date(state.local_date);
  since.setDate(since.getDate() - 27);
  const rows = await api(`/study/history?since=${since.toISOString().slice(0,10)}`);
  document.getElementById("history").innerHTML = rows.map(r =>
    `<div class="day ${r.status}" title="${r.date} · ${r.points} נק׳">${new Date(r.date+"T00:00:00").getDate()}</div>`
  ).join("");
}

async function loadShop(){
  const items = await api("/shop/items");
  document.getElementById("shop").innerHTML = items.map(i => `
    <div class="kv"><span>${i.name} (${i.owned}/${i.max_owned})</span>
    <span><button ${state.total_points<i.cost||i.owned>=i.max_owned?"disabled":""}
      onclick="buy('${i.sku}')">${i.cost} נק׳</button></span></div>`).join("");
}
async function buy(sku){ const r = await api("/shop/purchase",{method:"POST",body:{sku}});
  toast(`נרכש — נותרו ${r.balance}`); await boot(); }

async function devLogin(){
  const d = await api("/dev/login", {method:"POST", body:{
    email: document.getElementById("email").value,
    observes_shabbat: document.getElementById("shabbat-mode").value === "1"}});
  token = d.access_token; localStorage.setItem("token", token); await boot();
}
async function loadTractates(){
  const list = await api("/tractates");
  document.getElementById("tractate").innerHTML =
    list.map(t=>`<option value="${t.slug}">${t.name_he} — ${t.mishnayot} משניות</option>`).join("");
}
async function createPlan(){
  const d = await api("/plans", {method:"POST", body:{
    tractate_slug: document.getElementById("tractate").value,
    daily_goal: Number(document.getElementById("goal").value)}});
  toast(`סיום משוער: ${d.estimated_end_date}`); await boot();
}

async function tick(){
  const t = await api("/dev/time");
  document.getElementById("clock").textContent =
    new Date(t.simulated_utc).toLocaleString("he-IL",
      {weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
async function shift(delta){ await api("/dev/time",{method:"POST",body:delta}); await boot(); }
async function grant(){ await api("/dev/grant",{method:"POST",body:{points:200}}); await boot(); }
async function resetAll(){ await api("/dev/reset",{method:"POST"}); toast("אופס"); await boot(); }

(async () => {
  if (!token){ show("login"); await tick(); return; }
  try { await boot(); } catch { show("login"); }
})();
</script>
</body>
</html>
