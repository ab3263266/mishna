# Render blueprint: one web service + one Postgres database.
#
# There is deliberately NO cron service. Settlement runs on every read, so a
# user who returns after three weeks is settled correctly the moment they open
# the app - verified: 21 days away, one read, all 22 days resolved. A scheduled
# sweep only becomes necessary when something must be correct *without* the
# user showing up (a leaderboard, or streak-expiry notifications). At that
# point set RUN_SCHEDULER=true, which runs it inside this same web process.
services:
  - type: web
    name: mishnah-tracker
    runtime: docker
    # `free` spins down after 15 minutes idle and takes ~1 minute to wake. For
    # an app opened once a day that lands on a cold service every single time,
    # so move to `starter` once it is more than a trial.
    plan: free
    region: frankfurt      # closest Render region to Israel
    healthCheckPath: /health
    envVars:
      # Set by hand, from Neon. Render's own free Postgres is deleted 30 days
      # after creation, which is not a place to keep a streak.
      #
      # Neon hands you a `postgresql://` URL; this app drives psycopg 3, so the
      # scheme must read `postgresql+psycopg://`. (app/core/config.py rewrites
      # it either way - this is belt and braces.)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "false"     # never true on a public host - see core/preflight.py
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_SCHEDULER
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false        # https://<your-app>.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false        # <PUBLIC_BASE_URL>/api/v1/auth/google/callback

# No `databases:` block on purpose. Postgres comes from Neon, whose free tier
# does not expire; Render's does, 30 days after you create it.
