# Render blueprint: one web service + one Postgres database.
#
# There is deliberately NO cron service. Settlement runs on every read, so a
# user who returns after three weeks is settled correctly the moment they open
# the app - verified: 21 days away, one read, all 22 days resolved. A scheduled
# sweep only becomes necessary when something must be correct *without* the
# user showing up (a leaderboard, or streak-expiry notifications). At that
# point set RUN_SCHEDULER=true, which runs it inside this same web process.
services:
  - type: web
    name: mishnah-tracker
    runtime: docker
    plan: starter          # free sleeps after 15 min; a daily-habit app should not
    region: frankfurt      # closest Render region to Israel
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mishnah-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "false"     # never true on a public host - see core/preflight.py
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_SCHEDULER
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false        # https://<your-app>.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false        # <PUBLIC_BASE_URL>/api/v1/auth/google/callback

databases:
  - name: mishnah-db
    plan: basic-256mb
    region: frankfurt
